<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <mask id="jaw">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="28.5" y="2" width="7" height="13" rx="1" fill="#000"/>
    </mask>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- шестерёнка: зубья — штриховой контур, тело — круг, отверстие — цвет фона -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#fff" stroke-width="7"
          stroke-dasharray="7.07 7.07" transform="rotate(11.25 32 32)"/>
  <circle cx="32" cy="32" r="15" fill="#fff"/>
  <circle cx="32" cy="32" r="6" fill="url(#bg)"/>

  <!-- гаечный ключ по диагонали, с «прорезью» цвета фона, чтобы отделялся от шестерёнки -->
  <g transform="rotate(45 32 32)" mask="url(#jaw)">
    <g fill="#18181b" stroke="url(#bg)" stroke-width="3" paint-order="stroke">
      <rect x="28.5" y="16" width="7" height="40" rx="3.5"/>
      <circle cx="32" cy="14" r="9"/>
    </g>
  </g>
</svg>
